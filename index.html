<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Kid - Математический тренажёр</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Marker Felt', 'Arial Rounded MT Bold', 
                         -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1c3a5c 0%, #6ab2e3 100%);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            position: relative;
            overflow-x: hidden;
        }

        /* Фоновый эффект */
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .header {
            background: #1c3a5c;
            color: #f8f8f8;
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 5px solid #6ab2e3;
            position: relative;
            z-index: 100;
        }

        .header h1 {
            font-size: clamp(2em, 5vw, 3em);
            text-shadow: 3px 3px 0 #6ab2e3;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 700;
        }

        .header p {
            font-size: clamp(1em, 3vw, 1.2em);
            color: #e0f0ff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            min-height: 600px;
        }

        .grade-selection, .topic-selection, .content-area, .settings, .chat-container {
            background: #f8f8f8;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 4px solid #6ab2e3;
            position: relative;
            z-index: 100;
        }

        /* Стили кнопок навигации */
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: linear-gradient(135deg, #1c3a5c 0%, #2a4f7a 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-size: clamp(1em, 2.5vw, 1.2em);
            border: 3px solid #6ab2e3;
            font-weight: 700;
            flex: 1;
            min-width: 160px;
            position: relative;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #6ab2e3 0%, #8bc8ff 100%);
            color: #1c3a5c;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* ОБНОВЛЕННЫЕ СТИЛИ ПЕРСОНАЖЕЙ */
        .character-fullsize {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 500px;
            z-index: 1000;
            pointer-events: auto;
            transition: all 0.5s ease;
            transform-origin: bottom center;
        }

        .character-model {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            position: absolute;
            bottom: 0;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
            cursor: pointer;
        }

        /* МОДЕЛЬКИ ПЕРСОНАЖЕЙ */
        .robot-model {
            background-image: url('https://cdn-icons-png.flaticon.com/512/3344/3344372.png');
        }

        .teacher-model {
            background-image: url('https://cdn-icons-png.flaticon.com/512/1998/1998765.png');
        }

        .character-bubble {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffd166 0%, #ffb347 100%);
            color: #1c3a5c;
            padding: 20px 25px;
            border-radius: 25px;
            border: 4px solid #ff9e00;
            min-width: 250px;
            max-width: 300px;
            font-weight: 700;
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            animation: bubbleFloat 2s ease-in-out infinite;
            display: none;
            font-size: 1.2em;
            text-align: center;
            line-height: 1.4;
            z-index: 1001;
        }

        .character-bubble:after {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 18px 18px 0;
            border-style: solid;
            border-color: #ffd166 transparent transparent;
        }

        .character-bubble:before {
            content: '';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 20px 20px 0;
            border-style: solid;
            border-color: #ff9e00 transparent transparent;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            25% { 
                transform: translateY(-15px) rotate(2deg) scale(1.02); 
            }
            75% { 
                transform: translateY(-10px) rotate(-1deg) scale(1.01); 
            }
        }

        @keyframes bubbleFloat {
            0%, 100% { 
                transform: translateX(-50%) translateY(0px); 
            }
            50% { 
                transform: translateX(-50%) translateY(-10px); 
            }
        }

        .character-reaction {
            animation: happyJump 0.8s ease !important;
        }

        @keyframes happyJump {
            0%, 100% { 
                transform: translateY(0px) scale(1); 
            }
            30% { 
                transform: translateY(-60px) scale(1.2) rotate(-10deg); 
            }
            60% { 
                transform: translateY(-20px) scale(1.1) rotate(5deg); 
            }
        }

        .character-sad {
            animation: sadShake 1s ease !important;
        }

        @keyframes sadShake {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            20%, 60% { 
                transform: translateY(-20px) rotate(-5deg) scale(0.95); 
            }
            40%, 80% { 
                transform: translateY(-20px) rotate(5deg) scale(0.95); 
            }
        }

        .character-dance {
            animation: dance 2s ease infinite !important;
        }

        @keyframes dance {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg); 
            }
            25% { 
                transform: translateY(-30px) rotate(-15deg) scale(1.1); 
            }
            50% { 
                transform: translateY(-15px) rotate(15deg) scale(1.05); 
            }
            75% { 
                transform: translateY(-25px) rotate(-8deg) scale(1.08); 
            }
        }

        .grade-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .grade-btn {
            background: linear-gradient(135deg, #1c3a5c 0%, #2a4f7a 100%);
            color: #ffffff;
            border: none;
            padding: 25px 15px;
            font-size: clamp(1.2em, 3vw, 1.5em);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #6ab2e3;
            font-weight: 700;
            position: relative;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .grade-btn:hover {
            background: linear-gradient(135deg, #6ab2e3 0%, #8bc8ff 100%);
            transform: scale(1.05);
            color: #1c3a5c;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Стили для скроллбара */
        .topics-grid::-webkit-scrollbar {
            width: 10px;
        }

        .topics-grid::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .topics-grid::-webkit-scrollbar-thumb {
            background: #6ab2e3;
            border-radius: 10px;
        }

        .topics-grid::-webkit-scrollbar-thumb:hover {
            background: #4a9cd3;
        }

        .topic-card {
            background: linear-gradient(135deg, #6ab2e3 0%, #8bc8ff 100%);
            padding: 18px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid #1c3a5c;
            text-align: center;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .topic-card:hover {
            background: linear-gradient(135deg, #1c3a5c 0%, #2a4f7a 100%);
            color: white;
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .character-selection {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .character-option {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            border-radius: 20px;
            transition: all 0.4s ease;
            position: relative;
            z-index: 100;
            background: #f0f8ff;
            border: 3px solid transparent;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .character-option:hover {
            background: #6ab2e3;
            transform: translateY(-5px) scale(1.05);
            border-color: #1c3a5c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .character-option.selected {
            background: linear-gradient(135deg, #1c3a5c 0%, #2a4f7a 100%);
            color: white;
            transform: translateY(-5px) scale(1.08);
            border-color: #6ab2e3;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .character-option.selected p {
            color: white;
        }

        .character-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #6ab2e3;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background: white;
            padding: 5px;
        }

        .character-option:hover .character-img {
            transform: rotate(15deg) scale(1.1);
            border-color: #1c3a5c;
        }

        .character-option.selected .character-img {
            border-color: #ffd700;
            transform: rotate(0deg) scale(1.15);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        .chat-container {
            position: fixed;
            bottom: 20px;
            right: 450px;
            width: min(380px, 90vw);
            height: min(550px, 80vh);
            display: none;
            flex-direction: column;
            border: 4px solid #1c3a5c;
            z-index: 2000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 450px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4em;
            border: 4px solid #ff9e00;
            z-index: 1999;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .task {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            border: 3px solid #6ab2e3;
            position: relative;
            z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .task:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .result {
            margin-top: 15px;
            font-weight: bold;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct {
            background: linear-gradient(135deg, #6ab2e3 0%, #4caf50 100%);
            color: white;
            border: 3px solid #2e7d32;
        }

        .incorrect {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
            border: 3px solid #c62828;
        }

        .score-display {
            background: linear-gradient(135deg, #1c3a5c 0%, #2a4f7a 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: clamp(1.2em, 3vw, 1.4em);
            margin: 25px 0;
            border: 4px solid #6ab2e3;
            font-weight: 700;
            position: relative;
            z-index: 100;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .hidden {
            display: none;
        }

        .message {
            margin: 5px 0;
            padding: 15px 18px;
            border-radius: 15px;
            max-width: 85%;
            font-size: 1.05em;
            line-height: 1.5;
            animation: slideIn 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Области теории и практики */
        .theory-content, .practice-content {
            padding: 25px;
            background: linear-gradient(135deg, #e8f4ff 0%, #ffffff 100%);
            border-radius: 20px;
            margin: 20px 0;
            border: 3px solid #1c3a5c;
            line-height: 1.6;
            position: relative;
            z-index: 100;
            min-height: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .theory-text {
            padding: 25px;
            background: linear-gradient(135deg, #6ab2e3 0%, #8bc8ff 100%);
            border-radius: 15px;
            color: #1c3a5c;
            font-size: 1.2em;
            line-height: 1.8;
            border: 3px solid #1c3a5c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Адаптивность */
        @media (max-width: 1400px) {
            .character-fullsize {
                width: 350px;
                height: 450px;
            }
            .chat-container, .chat-toggle {
                right: 400px;
            }
        }

        @media (max-width: 1200px) {
            .character-fullsize {
                width: 300px;
                height: 400px;
            }
            .chat-container, .chat-toggle {
                right: 350px;
            }
        }

        @media (max-width: 992px) {
            .character-fullsize {
                width: 250px;
                height: 350px;
            }
            .chat-container, .chat-toggle {
                right: 280px;
            }
        }

        @media (max-width: 768px) {
            .character-fullsize {
                width: 200px;
                height: 300px;
                bottom: 10px;
                right: 10px;
            }
            .chat-container, .chat-toggle {
                right: 100px;
                bottom: 10px;
            }
            .topics-grid {
                max-height: 400px;
            }
        }

        @media (max-width: 576px) {
            .character-fullsize {
                width: 150px;
                height: 250px;
            }
            
            .chat-container, .chat-toggle {
                right: 20px;
                bottom: 10px;
            }
            
            .chat-container {
                width: calc(100vw - 40px);
                height: 60vh;
            }
            
            .topics-grid {
                grid-template-columns: 1fr;
                max-height: 300px;
            }
        }

        /* Кнопка "Позвать персонажа" */
        .summon-character {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1em;
            border: 3px solid #ff9e00;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @media (max-width: 576px) {
            .summon-character {
                display: block;
            }
        }
    </style>
</head>
<body>
    <!-- Фоновый узор -->
    <div class="background-pattern"></div>
    
    <!-- ПЕРСОНАЖ НА ПЕРВОМ ПЛАНЕ -->
    <div class="character-fullsize">
        <div class="character-model robot-model" id="fullsizeCharacter"></div>
        <div class="character-bubble" id="characterBubble"></div>
    </div>

    <!-- Кнопка для мобильных -->
    <button class="summon-character" onclick="toggleCharacter()">👾 Позвать помощника</button>

    <div class="container">
        <div class="header">
            <h1>Smart Kid</h1>
            <p>Интерактивный тренажёр по математике для начальной школы</p>
        </div>

        <div class="grade-selection" id="gradeSelection">
            <h2>Выбери свой класс:</h2>
            <div class="grade-buttons">
                <button class="grade-btn" onclick="selectGrade(1)">1 класс</button>
                <button class="grade-btn" onclick="selectGrade(2)">2 класс</button>
                <button class="grade-btn" onclick="selectGrade(3)">3 класс</button>
                <button class="grade-btn" onclick="selectGrade(4)">4 класс</button>
            </div>
        </div>

        <div class="topic-selection hidden" id="topicSelection">
            <h2>Выбери тему:</h2>
            <div class="topics-grid" id="topicsGrid"></div>
            <div class="navigation">
                <button class="nav-btn" onclick="backToGrades()">← Назад к классам</button>
            </div>
        </div>

        <div class="content-area hidden" id="contentArea">
            <div class="score-display">Твои баллы: <span id="score">0</span></div>
            <div class="navigation">
                <button class="nav-btn" onclick="showTheory()">📚 Теория</button>
                <button class="nav-btn" onclick="showPractice()">✏️ Практика</button>
            </div>
            <div id="theoryContent" class="theory-content">
                <div class="theory-text" id="theoryText"></div>
            </div>
            <div id="practiceContent" class="practice-content hidden"></div>
            <div class="navigation">
                <button class="nav-btn" onclick="backToTopics()">← Назад к темам</button>
            </div>
        </div>

        <div class="settings" id="settings">
            <h2>Выбери помощника:</h2>
            <div class="character-selection">
                <div class="character-option selected" onclick="selectCharacter('robot')">
                    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Робот" class="character-img">
                    <p>Умный Робот</p>
                </div>
                <div class="character-option" onclick="selectCharacter('teacher')">
                    <img src="https://https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Котёнок-учитель" class="character-img">
                    <p>Котёнок-Учитель</p>
                </div>
            </div>
        </div>
    </div>

    <button class="chat-toggle" onclick="toggleChat()">💬</button>
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">Чат с поддержкой</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message support-message">Привет! Я тут, чтобы помочь тебе с математикой. Задавай любые вопросы! 😊</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Напиши свой вопрос..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        // ПОЛНЫЙ НАБОР ТЕМ - 60 ТЕМ (15 НА КАЖДЫЙ КЛАСС)
        const curriculum = {
            1: [
                { title: "Числа от 1 до 5", theory: "Знакомимся с первыми числами! 1, 2, 3, 4, 5 - это наши первые друзья в мире математики. Каждое число показывает, сколько предметов мы видим.", tasks: [
                    { question: "Сколько будет 1 + 2?", answer: "3" }, { question: "Напиши число после 3", answer: "4" }, { question: "4 - 1 = ?", answer: "3" }, { question: "Какое число между 2 и 4?", answer: "3" }, { question: "2 + 2 = ?", answer: "4" }] },
                { title: "Числа от 1 до 10", theory: "Теперь изучаем числа до 10! Запоминаем, как они пишутся и как считаются. Счёт - это как лесенка: поднимаемся вверх!", tasks: [
                    { question: "3 + 4 = ?", answer: "7" }, { question: "Число после 7", answer: "8" }, { question: "6 - 3 = ?", answer: "3" }, { question: "Между 5 и 7", answer: "6" }, { question: "5 + 3 = ?", answer: "8" }] },

                    { question: "123 × 2 = ?", answer: "246" }, { question: "234 × 3 = ?", answer: "702" }, { question: "145 × 4 = ?", answer: "580" }, { question: "256 × 5 = ?", answer: "1280" }, { question: "378 × 6 = ?", answer: "2268" }] },
                { title: "Деление многозначных чисел", theory: "Делим многозначные числа: 486 ÷ 3. Делим последовательно каждый разряд. Деление - как распределение большого сокровища на равные части!", tasks: [
                    { question: "486 ÷ 2 = ?", answer: "243" }, { question: "693 ÷ 3 = ?", answer: "231" }, { question: "848 ÷ 4 = ?", answer: "212" }, { question: "975 ÷ 5 = ?", answer: "195" }, { question: "876 ÷ 6 = ?", answer: "146" }] },
                { title: "Дроби: сравнение и приведение", theory: "Чтобы сравнить дроби с разными знаменателями, приводим их к общему знаменателю. Это как перевести разные валюты в одну для сравнения!", tasks: [
                    { question: "Что больше: 1/2 или 1/3?", answer: "1/2" }, { question: "Что больше: 2/3 или 3/4?", answer: "3/4" }, { question: "1/2 = ?/4", answer: "2" }, { question: "2/3 = ?/6", answer: "4" }, { question: "3/4 = ?/8", answer: "6" }] },
                { title: "Сложение и вычитание дробей", theory: "Чтобы сложить дроби с разными знаменателями, находим общий знаменатель: 1/2 + 1/3 = 3/6 + 2/6 = 5/6. Общий знаменатель - общий язык дробей!", tasks: [
                    { question: "1/2 + 1/4 = ?", answer: "3/4" }, { question: "2/3 - 1/6 = ?", answer: "1/2" }, { question: "3/4 + 1/8 = ?", answer: "7/8" }, { question: "5/6 - 1/3 = ?", answer: "1/2" }, { question: "1/3 + 1/5 = ?", answer: "8/15" }] },
                { title: "Проценты", theory: "Процент - это сотая часть числа. 1% = 1/100. Чтобы найти процент от числа, умножаем число на процент и делим на 100. Проценты - everywhere в нашей жизни!", tasks: [
                    { question: "1% от 200", answer: "2" }, { question: "10% от 300", answer: "30" }, { question: "25% от 400", answer: "100" }, { question: "50% от 500", answer: "250" }, { question: "75% от 200", answer: "150" }] },
                { title: "Задачи на проценты", theory: "Решаем задачи с процентами: нахождение процента от числа, числа по его проценту, процентного отношения. Проценты помогают считать скидки и налоги!", tasks: [
                    { question: "20% от 150", answer: "30" }, { question: "Число, 10% которого равно 40", answer: "400" }, { question: "Сколько % составляет 25 от 100?", answer: "25" }, { question: "Цена 200 руб, скидка 15%. Новая цена?", answer: "170" }, { question: "Было 80, стало 100. На сколько % увеличилось?", answer: "25" }] },
                { title: "Площадь сложных фигур", theory: "Площадь сложной фигуры находим, разбивая её на простые фигуры (прямоугольники, треугольники). Это как разобрать сложный конструктор на детали!", tasks: [
                    { question: "Площадь двух квадратов 3×3 см", answer: "18" }, { question: "Площадь Г-образной фигуры 4×6 и 2×3 см", answer: "30" }, { question: "Площадь квадрата с вырезанным квадратом 1×1", answer: "8" }, { question: "Площадь 5×4 минус 2×2", answer: "16" }, { question: "Площадь трёх квадратов 2×2", answer: "12" }] },
                { title: "Объём прямоугольного параллелепипеда", theory: "Объём = длина × ширина × высота. Измеряется в кубических единицах (см³, м³). Объём показывает, сколько кубиков поместится внутри тела.", tasks: [
                    { question: "Объём 3×4×5 см", answer: "60" }, { question: "Объём куба с ребром 4 см", answer: "64" }, { question: "Длина параллелепипеда объёмом 60 см³, ширина 3 см, высота 4 см", answer: "5" }, { question: "Объём = 48 см³, стороны 4 см и 3 см, третья сторона?", answer: "4" }, { question: "Объём коробки 6×5×2 см", answer: "60" }] },
                { title: "Скорость, время, расстояние", theory: "S = V × t (расстояние = скорость × время), V = S ÷ t, t = S ÷ V. Важная формула движения! Помни её, как своё имя.", tasks: [
                    { question: "V=60 км/ч, t=2 ч. S=?", answer: "120" }, { question: "S=180 км, t=3 ч. V=?", answer: "60" }, { question: "S=240 км, V=80 км/ч. t=?", answer: "3" }, { question: "V=5 км/ч, t=4 ч. S=?", answer: "20" }, { question: "S=100 км, V=25 км/ч. t=?", answer: "4" }] },
                { title: "Задачи на совместную работу", theory: "Когда несколько работников работают вместе, их скорости складываются. Время = работа ÷ общая скорость. Вместе мы сила!", tasks: [
                    { question: "1-й за 6 ч, 2-й за 3 ч. Вместе за ? ч", answer: "2" }, { question: "Два за 4 ч, один за 6 ч. Второй за ? ч", answer: "12" }, { question: "Вместе за 2 ч, 1-й за 3 ч. 2-й за ? ч", answer: "6" }, { question: "Три одинаковых за 4 ч. Один за ? ч", answer: "12" }, { question: "1-й за 8 ч, 2-й за 4 ч. Вместе за ? ч", answer: "2.67" }] },
                { title: "Координатная плоскость", theory: "Учимся работать с координатами (x,y). x - горизонтально, y - вертикально. Начало координат - (0,0). Координаты - как адрес точки на карте!", tasks: [
                    { question: "Координаты: 3 вправо, 2 вверх", answer: "3,2" }, { question: "Точка (4,1). x=?, y=?", answer: "4,1" }, { question: "Расстояние от (0,0) до (3,4)", answer: "5" }, { question: "Симметричная (2,3) относительно оси x", answer: "2,-3" }, { question: "Точка (5,0) лежит на оси ?", answer: "x" }] },
                { title: "Среднее арифметическое", theory: "Среднее арифметическое = сумма всех чисел ÷ количество чисел. Находим 'среднее' значение. Это как найти справедливую оценку!", tasks: [
                    { question: "Среднее 4, 6, 8", answer: "6" }, { question: "Среднее 10, 20, 30", answer: "20" }, { question: "Среднее 5, 5, 5, 5", answer: "5" }, { question: "Среднее 12, 18, 24", answer: "18" }, { question: "Среднее 7, 8, 9, 10", answer: "8.5" }] },
                { title: "Масштаб", theory: "Масштаб показывает, во сколько раз уменьшено расстояние на карте. 1:1000 значит, что 1 см на карте = 1000 см в реальности. Карты - уменьшенные копии мира!", tasks: [
                    { question: "Масштаб 1:100, 3 см = ? м", answer: "3" }, { question: "Масштаб 1:50000, 2 см = ? км", answer: "1" }, { question: "Расстояние 4 км, масштаб 1:100000. На карте ? см", answer: "4" }, { question: "1:2000, 5 см = ? м", answer: "100" }, { question: "1:25000, 8 см = ? км", answer: "2" }] },
                { title: "Задачи на логику", theory: "Решаем нестандартные задачи, требующие логического мышления. Внимательно анализируем условие! Логика - наш главный помощник в математике.", tasks: [
                    { question: "2 числа: сумма 10, разность 4. Числа?", answer: "7,3" }, { question: "Отцу 40, сыну 10. Через сколько лет отец в 3 раза старше?", answer: "5" }, { question: "В семье 5 сыновей, у каждого сестра. Сколько детей?", answer: "6" }, { question: "5 яблок разделить на 5 человек, как оставить 1?", answer: "отдать" }, { question: "Что легче: 1 кг ваты или 1 кг железа?", answer: "одинаково" }] },
                { title: "Простые дроби и десятичные", theory: "Учимся переводить обыкновенные дроби в десятичные: 1/2 = 0.5, 1/4 = 0.25, 3/4 = 0.75. Дроби и десятичные - два языка одной математики!", tasks: [
                    { question: "1/2 = ? (десятичная)", answer: "0.5" }, { question: "1/4 = ? (десятичная)", answer: "0.25" }, { question: "3/4 = ? (десятичная)", answer: "0.75" }, { question: "1/5 = ? (десятичная)", answer: "0.2" }, { question: "2/5 = ? (десятичная)", answer: "0.4" }] }
            ]
        };

        let currentGrade = null;
        let currentTopic = null;
        let currentCharacter = 'robot';
        let score = 0;
        let currentTasks = [];
        
        const characterMessages = {
            robot: [
                "Бип-буп! Я РобоМат готов помогать с вычислениями!",
                "Загружаю математические алгоритмы... Готов к работе!",
                "Мои схемы показывают, что ты отлично справляешься!",
                "Электронный мозг анализирует: ты - будущий математический гений!",
                "⚡ Внимание! Обнаружены выдающиеся способности к математике!",
                "Роботодоказательство: математика = веселье²!",
                "Мои датчики фиксируют радость от решения задач!",
                "Активирован режим супер-помощника! Готов помогать!"
            ],
            teacher: [
                "Мяу! Я котёнок-учитель, и я обожаю математику!",
                "Давай решать задачки вместе! Это же так весело!",
                "Ты такой умный! Я горжусь твоими успехами!",
                "Мур-мур! Математика - это как игра в мышку-прятки!",
                "😸 Смотри, как я радуюсь твоим правильным ответам!",
                "Каждая решённая задача - это новая рыбка в моей миске!",
                "Ты делаешь большие успехи! Продолжай в том же духе!",
                "Мяу-тематику мы освоим вместе! Я в тебе уверен!"
            ]
        };

        function selectGrade(grade) {
            currentGrade = grade;
            document.getElementById('gradeSelection').classList.add('hidden');
            document.getElementById('topicSelection').classList.remove('hidden');
            showCharacterBubble(`${getCharacterName()} говорит: Выбери тему для изучения!`);
            
            const topicsGrid = document.getElementById('topicsGrid');
            topicsGrid.innerHTML = '';
            
            curriculum[grade].forEach((topic, index) => {
                const topicCard = document.createElement('div');
                topicCard.className = 'topic-card';
                topicCard.innerHTML = `
                    <h3>${topic.title}</h3>
                    <p>${topic.theory.substring(0, 60)}...</p>
                `;
                topicCard.onclick = () => selectTopic(index);
                topicsGrid.appendChild(topicCard);
            });
        }

        function backToGrades() {
            document.getElementById('topicSelection').classList.add('hidden');
            document.getElementById('contentArea').classList.add('hidden');
            document.getElementById('gradeSelection').classList.remove('hidden');
            showCharacterBubble(`${getCharacterName()} говорит: Выбирай класс и начинаем учиться!`);
        }

        function selectTopic(topicIndex) {
            currentTopic = topicIndex;
            document.getElementById('topicSelection').classList.add('hidden');
            document.getElementById('contentArea').classList.remove('hidden');
            
            const topic = curriculum[currentGrade][currentTopic];
            showCharacterBubble(`${getCharacterName()} говорит: Отлично! Тема "${topic.title}" очень интересная!`);
            
            showTheory();
            updateScoreDisplay();
        }

        // ИСПРАВЛЕННАЯ ФУНКЦИЯ - теперь правильно работает
        function backToTopics() {
            document.getElementById('contentArea').classList.add('hidden');
            document.getElementById('topicSelection').classList.remove('hidden');
            showCharacterBubble(`${getCharacterName()} говорит: Выбирай следующую тему для изучения!`);
        }

        function showTheory() {
            document.getElementById('practiceContent').classList.add('hidden');
            document.getElementById('theoryContent').classList.remove('hidden');
            
            const topic = curriculum[currentGrade][currentTopic];
            
            document.getElementById('theoryText').innerHTML = `
                <h3 style="color: #1c3a5c; margin-bottom: 15px; text-align: center; font-size: 1.8em;">${topic.title}</h3>
                <div style="font-size: 1.2em; line-height: 1.8; padding: 10px;">
                    ${topic.theory}
                </div>
            `;
            
            showCharacterBubble(`${getCharacterName()} говорит: Внимательно изучи теорию, а потом перейдём к практике!`);
        }

        function showPractice() {
            document.getElementById('theoryContent').classList.add('hidden');
            document.getElementById('practiceContent').classList.remove('hidden');
            showCharacterBubble(`${getCharacterName()} говорит: Пора проверить знания! Решай задания внимательно!`);
            
            const topic = curriculum[currentGrade][currentTopic];
            currentTasks = [...topic.tasks];
            
            const practiceHTML = topic.tasks.map((task, index) => `
                <div class="task" id="task${index}">
                    <h4>Задание ${index + 1}</h4>
                    <p>${task.question}</p>
                    <input type="text" id="answer${index}" placeholder="Твой ответ">
                    <button onclick="checkAnswer(${index})">Проверить</button>
                    <div id="result${index}" class="result"></div>
                </div>
            `).join('');
            
            document.getElementById('practiceContent').innerHTML = practiceHTML;
        }

        function checkAnswer(taskIndex) {
            const userAnswer = document.getElementById(`answer${taskIndex}`).value.trim().toLowerCase();
            const correctAnswer = currentTasks[taskIndex].answer.toLowerCase();
            const resultDiv = document.getElementById(`result${taskIndex}`);
            const character = document.getElementById('fullsizeCharacter');
            
            if (userAnswer === correctAnswer) {
                resultDiv.textContent = '✅ Правильно! Молодец!';
                resultDiv.className = 'result correct';
                score += 10;
                updateScoreDisplay();
                
                character.classList.add('character-reaction');
                setTimeout(() => {
                    character.classList.remove('character-reaction');
                }, 800);
                
                showCharacterBubble(`${getCharacterName()} радуется: Ура! Правильно! ${getHappyMessage()}`);
                
            } else {
                resultDiv.textContent = '❌ Попробуй ещё раз! Ты сможешь!';
                resultDiv.className = 'result incorrect';
                
                character.classList.add('character-sad');
                setTimeout(() => {
                    character.classList.remove('character-sad');
                }, 1000);
                
                showCharacterBubble(`${getCharacterName()} поддерживает: Не расстраивайся! Попробуй ещё раз, я верю в тебя!`);
            }
        }

        function getHappyMessage() {
            const messages = currentCharacter === 'robot' 
                ? ["Электронный мозг одобряет!", "Задача решена оптимально!", "Мои схемы ликуют!", "Вычисления верны на 100%!"]
                : ["Мур-мур! Отлично!", "Ты умнее, чем я думал!", "Так держать, дружок!", "Я так рад за тебя!"];
            return messages[Math.floor(Math.random() * messages.length)];
        }

        function updateScoreDisplay() {
            document.getElementById('score').textContent = score;
            
            const character = document.getElementById('fullsizeCharacter');
            if (score % 50 === 0 && score > 0) {
                character.classList.add('character-reaction');
                setTimeout(() => {
                    character.classList.remove('character-reaction');
                }, 800);
                showCharacterBubble(`${getCharacterName()} кричит: Ура! У тебя уже ${score} баллов! Ты супер!`);
                
                if (score % 100 === 0) {
                    character.classList.add('character-dance');
                    setTimeout(() => {
                        character.classList.remove('character-dance');
                    }, 2000);
                }
            }
        }

        function selectCharacter(character) {
            currentCharacter = character;
            document.querySelectorAll('.character-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            const fullsizeChar = document.getElementById('fullsizeCharacter');
            fullsizeChar.className = 'character-model ' + character + '-model';
            
            fullsizeChar.style.transform = 'scale(0.8) rotate(180deg)';
            fullsizeChar.style.opacity = '0.5';
            
            setTimeout(() => {
                fullsizeChar.style.transform = 'scale(1) rotate(0deg)';
                fullsizeChar.style.opacity = '1';
                showCharacterBubble(getGreetingMessage());
            }, 300);
        }

        function getCharacterName() {
            return currentCharacter === 'robot' ? 'РобоМат' : 'Котёнок-Учитель';
        }

        function getGreetingMessage() {
            return currentCharacter === 'robot' 
                ? "Бип-буп! Я РобоМат! Готов помогать с вычислениями!" 
                : "Мяу! Я котёнок-учитель! Давай учить математику вместе!";
        }

        function showCharacterBubble(message) {
            const bubble = document.getElementById('characterBubble');
            bubble.textContent = message;
            bubble.style.display = 'block';
            
            const colors = [
                'linear-gradient(135deg, #ffd166 0%, #ffb347 100%)',
                'linear-gradient(135deg, #6ab2e3 0%, #8bc8ff 100%)',
                'linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%)',
                'linear-gradient(135deg, #95e1d3 0%, #76c7ba 100%)'
            ];
            bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            setTimeout(() => {
                bubble.style.display = 'none';
            }, 5000);
        }

        function toggleCharacter() {
            const character = document.querySelector('.character-fullsize');
            character.style.display = character.style.display === 'none' ? 'block' : 'none';
        }

        document.getElementById('fullsizeCharacter').addEventListener('click', function() {
            const messages = characterMessages[currentCharacter];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            showCharacterBubble(randomMessage);
            
            this.classList.add('character-reaction');
            setTimeout(() => {
                this.classList.remove('character-reaction');
            }, 800);
        });

        function toggleChat() {
            const chat = document.getElementById('chatContainer');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const messagesContainer = document.getElementById('chatMessages');
            
            if (message) {
                const userMessage = document.createElement('div');
                userMessage.className = 'message user-message';
                userMessage.textContent = message;
                messagesContainer.appendChild(userMessage);
                
                input.value = '';
                
                const character = document.getElementById('fullsizeCharacter');
                character.classList.add('character-reaction');
                setTimeout(() => {
                    character.classList.remove('character-reaction');
                }, 300);
                
                showCharacterBubble(`${getCharacterName()} отвечает: Спасибо за вопрос! Давай разберём его вместе!`);
                
                setTimeout(() => {
                    const supportMessage = document.createElement('div');
                    supportMessage.className = 'message support-message';
                    supportMessage.textContent = getSupportResponse(message);
                    messagesContainer.appendChild(supportMessage);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 1000);
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function getSupportResponse(message) {
            const responses = [
                "Отличный вопрос! Давай разберём его вместе.",
                "Математика - это интересно! Попробуй решить задачу шаг за шагом.",
                "Не переживай, если не получается с первого раза. Практика - ключ к успеху!",
                "Помни: даже великие математики ошибались. Главное - не сдаваться!",
                "Отличная попытка! Хочешь, разберём эту тему подробнее?"
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateScoreDisplay();
            
            setTimeout(() => {
                const messages = characterMessages[currentCharacter];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                showCharacterBubble(randomMessage);
            }, 2000);
            
            setInterval(() => {
                if (Math.random() > 0.7) {
                    const messages = characterMessages[currentCharacter];
                    const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                    showCharacterBubble(randomMessage);
                }
            }, 20000);
            
            document.addEventListener('mousemove', function(e) {
                const character = document.getElementById('fullsizeCharacter');
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                character.style.transform = `translate(${(x - 0.5) * 20}px, ${(y - 0.5) * 20}px)`;
            });
        });
    </script>
</body>
</html>
